name: Publish Gradle Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 1.0.0 or 1.1.0-SNAPSHOT
        required: true
        default: 1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'
          cache: gradle

      - name: Publish manual version
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew publish -PprojVersion=${{ inputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tag version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew publish -PprojVersion="$VERSION"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}